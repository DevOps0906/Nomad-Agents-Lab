<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nomad · 그래프 벤치마크(단일 버퍼 렌더러)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #090d18; color: #d8e2ff; font-family: system-ui, sans-serif; overflow: hidden; }
      #graph-canvas { display: block; width: 100%; height: 100%; }
      #label-layer { position: fixed; inset: 0; pointer-events: none; }
      .bench-label { position: absolute; left: 0; top: 0; padding: 2px 6px; font-size: 12px; border-radius: 4px; background: rgba(9, 13, 24, .78); border: 1px solid #3a4a72; pointer-events: auto; color: inherit; }
      .bench-label.is-selected { border-color: #ffffff; }
      #bench-note { position: fixed; left: 8px; top: 8px; margin: 0; font-size: 12px; opacity: .8; }
    </style>
  </head>
  <body>
    <p id="bench-note">합성 샘플 그래프 벤치마크 — ?bench=노드수 (예: ?bench=1000)</p>
    <canvas id="graph-canvas" aria-label="합성 샘플 3D 그래프"></canvas>
    <div id="label-layer"></div>
    <script type="module" src="/src/bench-scalable.js"></script>
  </body>
</html>
